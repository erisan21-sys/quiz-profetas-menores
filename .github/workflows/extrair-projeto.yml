name: Extrair projeto

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Encontrar e extrair ZIP
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Nenhum arquivo ZIP encontrado."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

          rm -rf /tmp/projeto-extraido
          mkdir -p /tmp/projeto-extraido

          unzip -q "$ZIP" -d /tmp/projeto-extraido

      - name: Copiar arquivos do projeto
        run: |
          set -e

          cd /tmp/projeto-extraido

          if [ "$(find . -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ] && [ -d "$(find . -mindepth 1 -maxdepth 1 -type d)" ]; then
            SRC="$(find . -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          else
            SRC="."
          fi

          cd "$GITHUB_WORKSPACE"

          find . -mindepth 1 -maxdepth 1 ! -name ".git" ! -name ".github" ! -name "*.zip" -exec rm -rf {} +

          cp -a "/tmp/projeto-extraido/$SRC"/. .

      - name: Remover ZIP
        run: |
          rm -f ./*.zip

      - name: Salvar projeto no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
          else
            git commit -m "Adicionar projeto Quiz dos Profetas Menores"
            git push
          fi
