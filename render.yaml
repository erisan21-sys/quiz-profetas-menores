# ============================================================================
#  QUIZ BÍBLICO — PROFETAS MENORES · Blueprint do Render
# ----------------------------------------------------------------------------
#  Uso: repositório no GitHub/GitLab → Render → "New +" → "Blueprint".
#  O Render lê este arquivo e cria o serviço web com health check automático.
#  Deploy único no Render: backend Express + build do frontend React/PWA.
# ============================================================================
services:
  - type: web
    name: quiz-profetas-menores
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DB_DRIVER
        value: supabase
      - key: CORS_ORIGIN
        value: https://quiz-profetas-menores.onrender.com
      - key: SUPABASE_URL
        value: https://grgsclgmjwkeeiejscul.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TOKEN_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: HTTP_LOG
        value: combined
      - key: QUIZ_SIZE
        value: 20
      - key: QUIZ_DISTRIBUTION
        value: facil:6,medio:8,dificil:6
